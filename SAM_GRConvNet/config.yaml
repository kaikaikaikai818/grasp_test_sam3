environment:
  expected_gpu: NVIDIA GeForce RTX 3060 Ti

sam:
  checkpoint: ../weights/mobile_sam.pt
  clipseg_model: ../weights/clipseg-rd64-refined
  device: cuda
  threshold: 0.30
  min_area: 100
  min_score: 0.35
  max_objects: 10
  complete_object: true
  sam_score_tolerance: 0.12
  max_mask_fraction: 0.70
  overlap_merge: 0.20

recognition:
  min_similarity: 0.20
  min_margin: 0.01
  crop_padding: 0.10
  categories:
    adjustable_wrench:
      localization_prompt: adjustable wrench
      prompts:
        - a photo of an adjustable wrench
        - an adjustable wrench tool
        - a hand tool called an adjustable wrench
      aliases: [wrench, wrench handle, adjustable wrench handle, 扳手, 活动扳手]
      graspable: true
    screwdriver:
      localization_prompt: screwdriver
      prompts:
        - a photo of a screwdriver
        - a screwdriver tool
        - a hand tool called a screwdriver
      aliases: [screw driver, screwdriver handle, 螺丝刀, 改锥]
      graspable: true
    pliers:
      localization_prompt: pliers
      prompts:
        - a photo of pliers
        - a pair of pliers
        - a hand tool called pliers
      aliases: [plier, 钳子, 老虎钳]
      graspable: true
    hammer:
      localization_prompt: hammer
      prompts:
        - a photo of a hammer
        - a hammer tool
        - a hand tool called a hammer
      aliases: [hammer handle, 锤子, 榔头]
      graspable: true
    hex_key:
      localization_prompt: hex key
      prompts:
        - a photo of a hex key
        - an Allen key tool
        - an L-shaped hex wrench
      aliases: [allen key, hex wrench, 内六角, 内六角扳手]
      graspable: true
    pen:
      localization_prompt: pen
      prompts:
        - a photo of a pen
        - a writing pen
        - a pencil or pen
      aliases: [pencil, 笔, 铅笔]
      graspable: false
    mobile_phone:
      localization_prompt: mobile phone
      prompts:
        - a photo of a mobile phone
        - a smartphone
        - a rectangular cell phone
      aliases: [phone, smartphone, 手机]
      graspable: false
    box:
      localization_prompt: box
      prompts:
        - a photo of a box
        - a rectangular container
        - a storage case
      aliases: [case, container, 盒子]
      graspable: false
    other_tool:
      localization_prompt: other tool
      prompts:
        - a photo of another hand tool
        - an unknown tool
        - a miscellaneous object
      aliases: [other tool, unknown tool]
      graspable: false

grasp:
  backend: geometry
  opening_scale: 1.15
